name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_DISABLE_METRICS: 1
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite

jobs:
  build:
    name: ${{ matrix.os-name }} · ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, os-name: Linux, preset: x64-debug-clang, triplet: x64-linux-clang }
          - { os: ubuntu-26.04, os-name: Linux, preset: x64-debug-clang-shared, triplet: x64-linux-clang }
          - { os: windows-2025, os-name: Windows, preset: x64-debug-clang-cl, triplet: x64-windows-clang-cl }
          - { os: windows-2025, os-name: Windows, preset: x64-debug-clang-cl-shared, triplet: x64-windows-clang-cl }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Resolve the vcpkg submodule commit
        id: vcpkg
        shell: bash
        run: echo "commit=$(git rev-parse HEAD:extern/vcpkg)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}-${{ steps.vcpkg.outputs.commit }}

      # clang-cl needs the MS STL and the Windows SDK of an x64 Visual Studio environment.
      - uses: ilammy/msvc-dev-cmd@c1ed231f339aec74961130db0459823a08f1b215 # v1.9.0
        if: runner.os == 'Windows'
        with:
          arch: x64

      - name: Configure
        env:
          # vcpkg sanitizes PATH; its compiler detection needs clang-cl, found through the Visual Studio environment.
          VCPKG_KEEP_ENV_VARS: ${{ runner.os == 'Windows' && 'PATH' || '' }}
        run: cmake --preset ${{ matrix.preset }} -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --test-dir out/build/${{ matrix.preset }} --output-on-failure

  format:
    name: clang-format
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang-format
        run: pip install clang-format==23.1.4

      - name: Check formatting
        run: git ls-files -z -- '*.c' '*.h' '*.cpp' '*.hpp' | xargs -0 --no-run-if-empty clang-format --dry-run --Werror

  tidy:
    name: clang-tidy
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Resolve the vcpkg submodule commit
        id: vcpkg
        run: echo "commit=$(git rev-parse HEAD:extern/vcpkg)" >> "$GITHUB_OUTPUT"

      # Same key as the Linux build jobs: restores their vcpkg binary cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-x64-linux-clang-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}-${{ steps.vcpkg.outputs.commit }}

      - name: Install clang-tidy
        run: pip install clang-tidy==23.1.4

      # Configure and build: clang-tidy needs compile_commands.json and the generated headers.
      - name: Configure
        run: cmake --preset x64-debug-clang -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build --preset x64-debug-clang

      - name: Lint
        run: git ls-files -z -- 'sources/*.cpp' 'tests/*.cpp' | xargs -0 --no-run-if-empty clang-tidy -p out/build/x64-debug-clang --warnings-as-errors='*'

  coverage:
    name: coverage
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Resolve the vcpkg submodule commit
        id: vcpkg
        run: echo "commit=$(git rev-parse HEAD:extern/vcpkg)" >> "$GITHUB_OUTPUT"

      # Same key as the Linux build jobs: restores their vcpkg binary cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-x64-linux-clang-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}-${{ steps.vcpkg.outputs.commit }}

      - name: Configure
        run: cmake --preset x64-coverage-clang

      # Prints the report, and fails below the thresholds (AETHER_COVERAGE_MIN_* in cmake/helpers/Coverage.cmake).
      - name: Coverage
        run: cmake --build --preset x64-coverage-clang --target coverage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: out/build/x64-coverage-clang/coverage/html
          if-no-files-found: ignore
